sentence=Easy RC522 RFID card reader library: UID as text, allowed-card list, repeat protection, wiring check and clear tips. No MFRC522 library needed.
paragraph=Reads MIFARE cards and key fobs with the RC522 module: rfid.available() fires once per card, uidString() gives 04:A1:B2:C3, addCard() builds an allowed list so rfid.isAllowed() opens a door lock, and the same card left on the reader does not repeat. Checks that the RC522 really answers and tells in Russian, Kazakh or English what to fix (3.3 V only, SPI wires, SS and RST pins). The proven public-domain RC522 driver is built in, so no separate MFRC522 library is needed. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
